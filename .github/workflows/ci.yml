name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # API — needs Postgres
  # ─────────────────────────────────────────────
  api:
    name: API checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lifeos
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lifeos -d lifeos"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://lifeos:lifeos@localhost:5432/lifeos?schema=public
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy
        # If you don't have migrations yet, use:
        # run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Type-check / Build
        run: npm run build

      - name: Run tests
        run: npm run test

  # ─────────────────────────────────────────────
  # Web — pure build, no DB needed
  # ─────────────────────────────────────────────
  web:
    name: Web checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

  # ─────────────────────────────────────────────
  # Docker — verify compose stack actually boots
  # ─────────────────────────────────────────────
  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start stack
        run: docker compose up -d --build --wait
        env:
          # docker-compose.yml already sets these, but be explicit for clarity
          COMPOSE_PROJECT_NAME: lifeos-ci

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Smoke test API health
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            sleep 3
          done
          echo "API health check failed"
          exit 1

      - name: Smoke test Web
        run: curl -fsS http://localhost:8080/ > /dev/null

      - name: Tear down
        if: always()
        run: docker compose down -v
